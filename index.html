<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
    <title>Instant Pot Calculator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍲</text></svg>">
    <link rel="manifest" href='data:application/json,%7B"name":"Instant%20Pot%20Calculator","short_name":"IP%20Calc","start_url":"./index.html","display":"standalone","background_color":"%23f3f4f6","theme_color":"%232563eb"%7D'>

    <style>
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in 0.15s ease-out; }
        /* Hide number-input spinners so the big centred figure stays centred. */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .chevron { display: inline-block; transition: transform 0.15s ease-out; }
        .section-body.hidden { display: none; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 text-gray-900 p-4 font-sans flex justify-center items-start pt-6 sm:pt-10">

    <div class="bg-white rounded-2xl shadow-lg w-full max-w-md overflow-hidden pb-4">
        <div class="bg-blue-600 text-white p-5 text-center">
            <h1 class="text-xl font-bold flex items-center justify-center gap-2 tracking-wide">
                <span>🍲</span> INSTANT POT CALCULATOR
            </h1>
        </div>

        <div class="p-5 space-y-5">
            <div class="space-y-2">
                <button type="button" data-section="category" class="section-toggle w-full flex items-center justify-between text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <span>Category</span>
                    <span class="chevron">▾</span>
                </button>
                <div id="section-category" class="section-body">
                    <div id="category-grid" class="grid grid-cols-4 gap-2"></div>
                </div>
            </div>

            <div class="space-y-2" id="block-weight">
                <button type="button" data-section="weight" class="section-toggle w-full flex items-center justify-between text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <span id="weight-label">Dry Weight (grams)</span>
                    <span class="chevron">▾</span>
                </button>
                <div id="section-weight" class="section-body">
                    <input id="weight" type="number" inputmode="decimal" value="300" placeholder="0"
                        autocomplete="off"
                        class="w-full text-5xl font-black text-center text-blue-900 border-b-2 border-gray-200 focus:border-blue-600 outline-none pb-2 transition-colors">
                    <div id="weight-unit-toggle" class="flex justify-center gap-2 mt-2"></div>
                </div>
            </div>

            <div class="space-y-2">
                <button type="button" data-section="type" class="section-toggle w-full flex items-center justify-between text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <span id="item-label">Type</span>
                    <span class="chevron">▾</span>
                </button>
                <div id="section-type" class="section-body">
                    <div id="item-grid" class="grid grid-cols-2 gap-3 mt-3"></div>
                </div>
            </div>

            <div class="space-y-2" id="block-soak">
                <button type="button" data-section="soak" class="section-toggle w-full flex items-center justify-between text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <span id="soak-label">Soak Time</span>
                    <span class="chevron">▾</span>
                </button>
                <div id="section-soak" class="section-body space-y-2 animate-fade-in">
                    <div id="soak-controls">
                        <div class="flex items-center justify-center gap-3">
                            <button id="soak-dec" type="button" aria-label="Decrease soak time"
                                class="w-11 h-11 shrink-0 rounded-full border-2 border-gray-200 text-xl font-bold text-gray-500 hover:bg-gray-50 transition-colors">−</button>
                            <input id="soak-hours" type="number" inputmode="decimal" step="0.5" min="0" value="0" placeholder="0"
                                autocomplete="off"
                                class="w-24 text-3xl font-black text-center text-blue-900 border-b-2 border-gray-200 focus:border-blue-600 outline-none pb-2 transition-colors">
                            <button id="soak-inc" type="button" aria-label="Increase soak time"
                                class="w-11 h-11 shrink-0 rounded-full border-2 border-gray-200 text-xl font-bold text-gray-500 hover:bg-gray-50 transition-colors">+</button>
                        </div>
                        <div class="text-center mt-1">
                            <button id="soak-reset" type="button" class="text-xs font-bold text-blue-600 hover:text-blue-800 underline underline-offset-2">
                                ↺ Reset to recommended
                            </button>
                        </div>
                        <div id="soak-cap-note" class="hidden text-xs text-slate-400 text-center mt-1"></div>
                    </div>
                    <div id="note" class="text-xs font-semibold text-slate-500 text-center px-1"></div>
                    <div id="warning" class="hidden text-xs font-bold text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-3 text-center"></div>
                </div>
            </div>

            <div class="space-y-2 hidden" id="block-prepguide">
                <button type="button" data-section="prepguide" class="section-toggle w-full flex items-center justify-between text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <span>Prep Guide</span>
                    <span class="chevron">▾</span>
                </button>
                <div id="section-prepguide" class="section-body space-y-4">
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
                        <div class="text-xs font-bold text-slate-500 uppercase tracking-wider">Bicarb Wash Calculator</div>
                        <div class="flex items-center justify-center gap-2">
                            <label for="prep-wash-weight" class="sr-only">Produce weight in grams</label>
                            <input id="prep-wash-weight" type="number" inputmode="decimal" min="50" step="50" value="500"
                                autocomplete="off" aria-label="Produce weight in grams"
                                class="w-24 text-2xl font-black text-center text-blue-900 border-b-2 border-gray-200 focus:border-blue-600 outline-none pb-1 transition-colors">
                            <span class="text-sm font-semibold text-slate-500">g produce</span>
                        </div>
                        <label for="prep-wash-slider" class="sr-only">Produce weight slider</label>
                        <input id="prep-wash-slider" type="range" min="100" max="3000" step="50" value="500" class="w-full accent-blue-600" aria-label="Produce weight slider">
                        <div class="grid grid-cols-2 gap-3 text-center">
                            <div>
                                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Wash Water</div>
                                <div id="prep-wash-water" class="text-lg font-black text-blue-600">500 mL</div>
                            </div>
                            <div>
                                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Bicarb Soda</div>
                                <div id="prep-wash-bicarb" class="text-lg font-black text-slate-800">1 tsp</div>
                            </div>
                        </div>
                        <div class="text-xs text-slate-400 text-center">~1 tsp bicarb per 2 cups (500mL) water, enough to submerge; adjust for your bowl size.</div>
                    </div>
                    <div id="prep-cleaning"></div>
                    <div id="prep-destarch"></div>
                    <div id="prep-method-tabs" class="flex flex-wrap gap-2"></div>
                    <div id="prep-steps" class="space-y-4"></div>
                </div>
            </div>

            <hr class="border-gray-100">

            <div class="space-y-2" id="block-results">
                <button type="button" data-section="results" class="section-toggle w-full flex items-center justify-between text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <span>Results</span>
                    <span class="chevron">▾</span>
                </button>
                <div id="section-results" class="section-body">
                    <div class="bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-4 shadow-inner">
                        <div id="liquid-select" class="hidden pb-3 border-b border-slate-200">
                            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 text-center">Cooking Liquid</div>
                            <div id="liquid-toggle" class="flex justify-center gap-2 flex-wrap"></div>
                        </div>
                        <div class="flex justify-between items-end border-b border-slate-200 pb-3">
                            <div>
                                <div id="water-label" class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Add Water</div>
                                <div class="flex items-center gap-2">
                                    <span class="text-2xl">💧</span>
                                    <span id="water" class="text-4xl font-black text-blue-600">0</span>
                                    <span id="water-unit-label" class="text-lg font-bold text-blue-400 mb-1">mL</span>
                                </div>
                                <div id="water-unit-toggle" class="flex gap-2 mt-1"></div>
                                <div id="ratio" class="text-xs font-semibold text-slate-400 mt-1"></div>
                            </div>
                        </div>
                        <div class="flex justify-between items-end border-b border-slate-200 pb-3">
                            <div>
                                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">High Pressure</div>
                                <div class="flex items-center gap-2">
                                    <span class="text-2xl">⏱️</span>
                                    <span id="time" class="text-4xl font-black text-slate-800">0</span>
                                    <span class="text-lg font-bold text-slate-400 mb-1">min</span>
                                </div>
                                <div id="total-time" class="text-xs font-semibold text-slate-400 mt-1"></div>
                            </div>
                        </div>
                        <div class="flex justify-between items-center pt-1">
                            <div>
                                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Release Method</div>
                                <div class="flex items-center gap-2">
                                    <span class="text-2xl">💨</span>
                                    <span id="release" class="text-xl font-bold text-slate-700">10 Min NPR</span>
                                </div>
                            </div>
                        </div>
                        <div id="liquid-warning" class="hidden text-xs font-bold text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-3 text-center"></div>
                    </div>
                </div>
            </div>

            <div class="space-y-2" id="block-method">
                <button type="button" data-section="method" class="section-toggle w-full flex items-center justify-between text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <span>Method</span>
                    <span class="chevron">▾</span>
                </button>
                <div id="section-method" class="section-body">
                    <ol id="method-list" class="list-decimal list-inside space-y-1.5 text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded-xl p-4"></ol>
                    <div class="text-center mt-2">
                        <button id="copy-method" type="button" class="text-xs font-bold text-blue-600 hover:text-blue-800 underline underline-offset-2">📋 Copy method</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    // ratio = mL water per gram of dry weight. time = High Pressure minutes.
    // soakMinutes = point at which soaking's benefit fully caps out (used to
    // interpolate ratio/time between unsoaked and `soak`). defaultSoakMinutes
    // = value the soak-hours input starts at for that item; usually equal to
    // soakMinutes, but can be lower when soaking is optional rather than the
    // recommended default (see Jasmine). soakStep = replaces the generic soak
    // wording (Mujaddara soaks only the lentils, in just-boiled water); a string,
    // or a function of the soaked hours (capped at soakMinutes) returning one.
    // parCook = {step, minutes}: a head-start step used instead of the soak
    // whenever soak hours are under the soakMinutes cap; see parCookActive().
    // methodIntro/methodOutro = optional extra steps prepended/appended to the
    // generic pressure-cooking method (e.g. caramelizing onions for Mujaddara).
    // Either can be a single string or an array of strings when more than one
    // extra step is needed (White Basmati's methodOutro is the first array use).
    // skipRinse = true skips the generic "rinse" step (oats don't need it).
    // rinseStep (item or category) = replaces the generic rinse wording, e.g.
    // "pick over for stones" for pulses. methodPreCook = extra steps inserted
    // right before the "add to the Instant Pot" step (e.g. tossing rinsed rice
    // in a little oil to stop grains clumping). soak.release (optional) swaps
    // the release method once any soak time is set, since pre-softened grains
    // need less residual steam; see activeRelease() below. defaultOutro
    // (category) = the closing Method step when an item has no methodOutro
    // ("fluff with a fork" is only
    // right for grains).
    // gramsPerCup = approximate weight of 1 US cup of this dry ingredient, only
    // used to convert the weight input to/from "cup" units (water needs no such
    // figure since it's converted by pure volume/mass math).
    const categories = {
        rice: {
            label: 'Rice', icon: '🍚',
            items: {
                'white-basmati': {
                    label: 'White Basmati', icon: '🍚', ingredientLabel: 'basmati rice',
                    ratio: 1.2, time: 4, release: '10 Min NPR', gramsPerCup: 185,
                    soakMinutes: 30, defaultSoakMinutes: 30,
                    soak: { ratio: 1.0, time: 1, release: '5 Min NPR' },
                    note: '💧 Soaked 30 min: cuts water & 3 min off cook time, and switches release to 5 Min NPR (down from 10) so the pre-softened grains spend less time under residual steam',
                    methodPreCook: ['Toss the drained rice with ½ tsp oil or ghee; a light coating keeps surface starch from gluing grains together as they cook.'],
                    methodOutro: [
                        'Fluff immediately with a fork, lifting from the base rather than stirring.',
                        'Leave it uncovered, or loosely covered with a tea towel, for a minute or two so the steam escapes, then serve. Sealing the lid back down while it is still steaming is what usually reglues the grains, more than release timing or anything else.',
                    ],
                },
                'jasmine': {
                    label: 'Jasmine', icon: '🌸', ingredientLabel: 'jasmine rice',
                    // 1.2 mL/g: sources are 1:1 by volume, which is 1.2 to 1.28 mL/g
                    // depending on cup weight (185 to 200 g); 1.2 matches White Basmati.
                    ratio: 1.2, time: 3, release: '10 Min NPR', gramsPerCup: 185,
                    soakMinutes: 30, defaultSoakMinutes: 0,
                    soak: { ratio: 1.0, time: 2 },
                    note: '💧 Soaking 20–30 min is optional for jasmine: less sticky, 1 min less cook time',
                },
                'brown-basmati': {
                    label: 'Brown Basmati', icon: '🌾', ingredientLabel: 'brown basmati rice',
                    ratio: 1.25, time: 20, release: '10 Min NPR', gramsPerCup: 190,
                    soakMinutes: 120, defaultSoakMinutes: 120,
                    soak: { ratio: 1.1, time: 16 },
                    note: '💧 Soaked 2+ hrs (recommended): less water, cooks 4 min faster & more evenly',
                },
                'standard-brown': {
                    label: 'Standard Brown', icon: '🟤', ingredientLabel: 'brown rice',
                    ratio: 1.25, time: 22, release: '10 Min NPR', gramsPerCup: 195,
                    soakMinutes: 120, defaultSoakMinutes: 120,
                    soak: { ratio: 1.1, time: 18 },
                    note: '💧 Soaked 2+ hrs (recommended): less water, cuts 4 min off cook time',
                },
            },
        },
        oats: {
            label: 'Oats', icon: '🌾',
            defaultOutro: 'Stir well (it thickens as it stands), then add milk, sweetener, or fruit to taste.',
            items: {
                'steel-cut': {
                    label: 'Steel-Cut', icon: '🌾', ingredientLabel: 'steel-cut oats',
                    ratio: 4.0, time: 4, release: '10 Min NPR', gramsPerCup: 175,
                    soakMinutes: 480, defaultSoakMinutes: 480,
                    soak: { ratio: 3.0, time: 1 },
                    note: '💧 Soaked overnight (8 hrs, recommended): softens the grain, less water & cook time drops from 4 to 1 min',
                    skipRinse: true,
                },
                'rolled': {
                    label: 'Rolled (Old-Fashioned)', icon: '🥣', ingredientLabel: 'rolled oats',
                    ratio: 3.0, time: 1, release: '10 Min NPR', gramsPerCup: 85,
                    soakMinutes: 0, defaultSoakMinutes: 0,
                    soak: null,
                    note: 'No soak needed; rolled oats are already soft and soaking makes them mushy. Oats foam under pressure, so let them release naturally rather than venting straight away.',
                    skipRinse: true,
                },
            },
        },
        quinoa: {
            label: 'Quinoa', icon: '🌱',
            items: {
                'quinoa': {
                    label: 'Quinoa', icon: '🌱',
                    ratio: 1.4, time: 1, release: '10 Min NPR', gramsPerCup: 170,
                    soakMinutes: 20, defaultSoakMinutes: 20,
                    soak: { ratio: 1.3, time: 1 },
                    note: '💧 Soaking (& rinsing) 20–30 min removes bitterness (saponins) and aids digestion. Quinoa foams, so let it release naturally.',
                    rinseStep: 'Rinse the quinoa in a fine-mesh sieve under cold water for a minute to wash off the bitter saponin coating.',
                },
            },
        },
        lentils: {
            label: 'Lentils', icon: '🟤',
            rinseStep: 'Pick over the lentils for stones and debris, then rinse under cold water.',
            defaultOutro: 'Season with salt and serve.',
            items: {
                'red': {
                    label: 'Red (Split)', icon: '🔴', ingredientLabel: 'red lentils',
                    ratio: 2.2, time: 4, release: '10 Min NPR', gramsPerCup: 195,
                    soakMinutes: 0, defaultSoakMinutes: 0,
                    soak: null,
                    note: 'No soak needed; split red lentils cook fast and break down into a soft dal either way. They foam, so let the pressure drop naturally.',
                    methodOutro: 'Stir well (it thickens as it stands), season with salt, and serve.',
                },
                'brown-green': {
                    label: 'Brown/Green', icon: '🟤', ingredientLabel: 'lentils',
                    ratio: 2.2, time: 9, release: '10 Min NPR', gramsPerCup: 192,
                    soakMinutes: 60, defaultSoakMinutes: 60,
                    soak: { ratio: 1.6, time: 6 },
                    note: '💧 Soaked 1 hr (recommended): cooks faster & more evenly (not strictly required)',
                },
            },
        },
        beans: {
            label: 'Beans', icon: '🫘',
            rinseStep: 'Pick over the beans for stones and shrivelled ones, then rinse under cold water.',
            defaultOutro: 'Check a bean is tender (if not, cook 5 min more on High Pressure), then season with salt, drain any excess liquid, and serve.',
            items: {
                'chickpeas': {
                    label: 'Chickpeas', icon: '🟡',
                    ratio: 3.6, time: 38, release: '15 Min NPR', gramsPerCup: 200,
                    soakMinutes: 480, defaultSoakMinutes: 480,
                    soak: { ratio: 2.6, time: 13 },
                    note: '💧 Soaked overnight (8 hrs, recommended): time drops from 38 to 13 min, creamier texture',
                },
                'kidney': {
                    label: 'Kidney (Red)', icon: '🔴', ingredientLabel: 'kidney beans',
                    ratio: 3.5, time: 45, release: '15 Min NPR', gramsPerCup: 185,
                    soakMinutes: 480, defaultSoakMinutes: 480,
                    soak: { ratio: 2.5, time: 12 },
                    note: '💧 Soaked overnight (8 hrs, recommended): time drops from 45 to 12 min',
                    warning: '⚠️ Dried kidney beans contain phytohaemagglutinin, a toxin destroyed by 10 min at a full boil. Discard the soaking water, never cook them in a slow cooker or on low heat, and boil hard (uncovered) 10 min before pressure cooking as an extra safeguard.',
                    toxinBoil: true,
                },
                'cannellini': {
                    label: 'Cannellini', icon: '⚪', ingredientLabel: 'cannellini beans',
                    ratio: 3.5, time: 35, release: '15 Min NPR', gramsPerCup: 185,
                    soakMinutes: 480, defaultSoakMinutes: 480,
                    soak: { ratio: 2.5, time: 12 },
                    note: '💧 Soaked overnight (8 hrs, recommended): time drops from 35 to 12 min',
                    warning: '⚠️ Same bean family as kidney beans: discard the soaking water and boil hard (uncovered) 10 min before pressure cooking as an extra safeguard against natural toxins.',
                    toxinBoil: true,
                },
                'black': {
                    label: 'Black Beans', icon: '⚫',
                    ratio: 3.3, time: 22, release: '15 Min NPR', gramsPerCup: 190,
                    soakMinutes: 480, defaultSoakMinutes: 480,
                    soak: { ratio: 2.4, time: 10 },
                    note: '💧 Soaked overnight (8 hrs, recommended): time drops from 22 to 10 min',
                },
                'pinto': {
                    label: 'Pinto Beans', icon: '🟤',
                    ratio: 3.3, time: 25, release: '15 Min NPR', gramsPerCup: 190,
                    soakMinutes: 480, defaultSoakMinutes: 480,
                    soak: { ratio: 2.4, time: 15 },
                    note: '💧 Soaked overnight (8 hrs, recommended): time drops from 25 to 15 min',
                },
                'ful-medames': {
                    label: 'Ful Medames (Fava)', icon: '🫘', ingredientLabel: 'fava beans',
                    ratio: 3.8, time: 45, release: '15 Min NPR', gramsPerCup: 180,
                    soakMinutes: 600, defaultSoakMinutes: 600,
                    soak: { ratio: 2.8, time: 20 },
                    note: '💧 Use whole, skin-on dried fava (not split). Soaking 8–12 hrs (recommended 10) is essential and roughly halves cook time',
                    methodOutro: 'Lightly mash, then drizzle with olive oil, lemon juice, and a pinch of cumin before serving.',
                },
            },
        },
        combo: {
            label: 'Combo Dishes', icon: '🍛',
            items: {
                'mujaddara': {
                    label: 'Mujaddara (Lentils+Rice)', icon: '🍛', ingredientLabel: 'lentils and rice',
                    rinseStep: 'Rinse the lentils and the rice separately under cold water; pick over the lentils for stones.',
                    ratio: 1.5, time: 6, release: '10 Min NPR', gramsPerCup: 190,
                    soakMinutes: 60, defaultSoakMinutes: 60,
                    // Soaked values equal the unsoaked ones on purpose: parCook stands in
                    // for the soak, so the main cook is the same either way and the soak
                    // interpolation is a no-op here. Not a copy-paste slip.
                    soak: { ratio: 1.5, time: 6 },
                    note: 'Weight = combined brown/green lentils + white basmati, split 1:1 by weight. The lentils need a head start so they finish with the rice: soak them 1 hr in just-boiled water (the default), or set the soak to 0 and the Method adds a quick par-cook instead. Either way the water is only ~1.5 mL/g, far less than plain lentils, which keeps the rice from going mushy.',
                    soakStep: (soaked) => (soaked >= 1
                        ? 'Soak just the lentils (not the rice) in just-boiled water for about 1 hr, or in cold water overnight, then drain and discard the soaking water.'
                        : `Soak just the lentils (not the rice) in just-boiled water for ${formatDuration(soaked)}, then drain and discard the soaking water. That is short of the full 1 hr, so do the par-cook step below as well.`),
                    parCook: {
                        step: 'Par-cook the lentils (skip this after a full 1 hr soak): cover them with water by about 2cm in the pot, cook 1 min on High Pressure, let the pressure release naturally for 10 min, then drain.',
                        minutes: 20,
                    },
                    methodIntro: ['Thinly slice 1 large onion per 200g dry mix and fry in oil (on Sauté or in a pan) until deep golden brown; set aside for garnish. If using Sauté, deglaze the pot with a splash of water so nothing is stuck to the base.'],
                    methodOutro: 'Fluff, top with the caramelized onions, and serve warm.',
                },
            },
        },
        congee: {
            label: 'Congee', icon: '🥣',
            defaultOutro: 'Stir well; it thickens as it stands, so thin with hot water to taste.',
            items: {
                'plain': {
                    label: 'Plain Congee', icon: '🥣', ingredientLabel: 'Rice',
                    ratio: 8.0, time: 20, release: 'Full NPR', gramsPerCup: 185,
                    soakMinutes: 0, defaultSoakMinutes: 0,
                    soak: null,
                    note: 'Congee uses ~6–8x water to rice by volume (vs ~1:1 for steamed rice). No soak needed; the long cook and natural release break the grains down into porridge on their own.',
                    warning: '⚠️ Congee foams and expands a lot. Never fill the pot past the half-full line, and always let the pressure release fully and naturally (no quick release) to avoid clogging the valve with starchy foam.',
                    methodOutro: 'Stir well; it thickens as it stands, so thin with hot water to taste. Season with salt and top with spring onion, ginger, sesame oil, or a soft egg.',
                },
                'beef-mince': {
                    label: 'Beef Mince Congee', icon: '🥩', ingredientLabel: 'Rice',
                    ratio: 8.0, time: 20, release: 'Full NPR', gramsPerCup: 185,
                    soakMinutes: 0, defaultSoakMinutes: 0,
                    soak: null,

    // Produce items carry a `prepGuide` instead of ratio/time/release/soak, so they
    // aren't pressure-cook ratios at all, so render() branches into renderPrepGuide()
    // for them rather than forcing fake values through the ratio-based path.
    const isPrepItem = (item) => !!item.prepGuide;

    const RELEASE_INSTRUCTIONS = {
        '10 Min NPR': 'Let the pressure release naturally for 10 minutes, then quick-release any remainder.',
        '15 Min NPR': 'Let the pressure release naturally for 15 minutes, then quick-release any remainder.',
        'Quick Release': 'Use Quick Release to vent the pressure as soon as cooking finishes.',
        'Full NPR': 'Let the pressure release fully and naturally (roughly 15–25 min) and do not quick-release. Starchy, foamy foods like congee can spit hot liquid through the valve if vented early.',
        '5 Min NPR': 'Let the pressure release naturally for 5 minutes, then quick-release any remainder.',
    };

    // Approximate minutes each release method takes, for the total-time estimate.
    const RELEASE_MINUTES = { '10 Min NPR': 10, '15 Min NPR': 15, 'Quick Release': 1, 'Full NPR': 20, '5 Min NPR': 5 };

    // Instant Pot needs roughly a cup of thin liquid to come to pressure (a 6 qt
    // pot; 8 qt wants more), and foamy grains/pulses must stay under the
    // half-full line. Both are shown as warnings, never enforced.
    const MIN_LIQUID_ML = 250;
    const HALF_FULL_ML = 2800;

    const SOAK_STEP = 0.5;
    const MAX_SOAK_HOURS = 24;
    const clampHours = (h) => Math.min(MAX_SOAK_HOURS, Math.max(0, Number.isFinite(h) ? h : 0));

    let weight = 300;
    let currentCategory = 'rice';
    let currentItemId = 'white-basmati';

    const currentItem = () => categories[currentCategory].items[currentItemId];

    let soakHours = (currentItem().defaultSoakMinutes || 0) / 60;
    let selectedMethodId = null;
    let selectedLiquidId = currentItem().liquidOptions ? currentItem().liquidOptions.recommended : null;

    const soakFraction = (item, hours) => {
        if (!item.soak || item.soakMinutes <= 0) return 0;
        const capHours = item.soakMinutes / 60;
        return Math.min(Math.max(hours, 0), capHours) / capHours;
    };

    // Release method can switch once any soak time is set: pre-softened grains
    // don't need as much residual steam, and cutting that short is what stops
    // them clumping together as they sit. Discrete (not interpolated like
    // ratio/time) since release methods aren't a continuum.
    const activeRelease = (item, hours) => {
        if (item.soak && item.soak.release && hours > 0) return item.soak.release;
        return item.release;
    };

    // Rough wall-clock estimate: time to reach pressure scales with the liquid
    // volume, then the cook time, then the release.
    const estimateTotalMinutes = (release, water, time) => {
        const pressurise = water >= 1500 ? 15 : water >= 750 ? 12 : 8;
        return pressurise + time + (RELEASE_MINUTES[release] || 10);
    };

    // parCook = {step, minutes}: a head-start cook (Mujaddara's lentils) that
    // stands in for the soak, so it applies whenever the soak is short of the
    // item's soakMinutes cap, not only at 0.
    const parCookActive = (item, hours) => !!item.parCook && hours < item.soakMinutes / 60;

    const formatDuration = (hours) => {
        const mins = Math.round(hours * 60);
        if (mins < 60) return `${mins} min`;
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        const hText = h === 1 ? '1 hr' : `${h} hrs`;
        return m ? `${hText} ${m} min` : hText;
    };

    const activeRatio = (item, hours) => {
        if (!item.soak) return item.ratio;
        const f = soakFraction(item, hours);
        return item.ratio + (item.soak.ratio - item.ratio) * f;
    };

    const activeTime = (item, hours) => {
        if (!item.soak) return item.time;
        const f = soakFraction(item, hours);
        return Math.round(item.time + (item.soak.time - item.time) * f);
    };

    const calculateWater = (w, item, hours) => {
        if (!w || w <= 0) return 0;
        return Math.round((w * activeRatio(item, hours)) / 10) * 10;
    };

    const weightLabelFor = (categoryId) => {
        if (categoryId === 'combo') return 'Combined Dry Weight (Lentils + Rice, 1:1)';
        if (categoryId === 'congee') return 'Dry Rice Weight (for Congee)';
        return `Dry ${categories[categoryId].label} Weight`;

    const selectedLiquidChoice = (item, id) => {
        if (!item.liquidOptions) return null;
        return item.liquidOptions.choices.find((c) => c.id === id)
            || item.liquidOptions.choices.find((c) => c.id === item.liquidOptions.recommended);

    const itemLabelFor = (categoryId) => (categoryId === 'combo' ? 'Dish' : `${categories[categoryId].label} Type`);

    // --- Unit conversion (display/input boundary only; `weight` stays canonical
    // in grams and `water` stays canonical in mL throughout the rest of the app) ---
    const GRAMS_PER_OZ = 28.3495;
    const ML_PER_CUP = 236.588;
    const ML_PER_FLOZ = 29.5735;

    const WEIGHT_UNITS = [
        { id: 'g', label: 'g' },
        { id: 'oz', label: 'oz' },
        { id: 'cup', label: 'cup' },
    ];
    const WATER_UNITS = [
        { id: 'mL', label: 'mL' },
        { id: 'cup', label: 'cup' },
        { id: 'floz', label: 'fl oz' },
    ];

    const gramsToDisplay = (grams, unit, item) => {
        if (unit === 'oz') return grams / GRAMS_PER_OZ;
        if (unit === 'cup') return grams / item.gramsPerCup;
        return grams;
    };

    const displayToGrams = (value, unit, item) => {
        if (unit === 'oz') return value * GRAMS_PER_OZ;
        if (unit === 'cup') return value * item.gramsPerCup;
        return value;
    };

    const mlToDisplay = (ml, unit) => {
        if (unit === 'cup') return ml / ML_PER_CUP;
        if (unit === 'floz') return ml / ML_PER_FLOZ;
        return ml;
    };

    const formatWeight = (grams, unit, item) => {
        const v = gramsToDisplay(grams, unit, item);
        return unit === 'g' ? String(Math.round(v)) : v.toFixed(2);
    };

    const formatWater = (ml, unit) => {
        const v = mlToDisplay(ml, unit);
        if (unit === 'mL') return String(Math.round(v));
        return unit === 'floz' ? v.toFixed(1) : v.toFixed(2);
    };

    // methodIntro/methodOutro/methodPreCook may be a string or an array of strings.
    const asSteps = (v) => (Array.isArray(v) ? v : [v]);

    const generateMethodSteps = (item, category, water, time, hours, liquid, unit) => {
        const steps = [];
        const ingredientLabel = (item.ingredientLabel || item.label).toLowerCase();
        if (item.methodIntro) steps.push(...asSteps(item.methodIntro));
        if (!item.skipRinse) {
            steps.push(item.rinseStep || category.rinseStep
                || `Rinse the dry ${ingredientLabel} under cold water until it runs clear.`);
        }
        if (item.soak && hours > 0) {
            const capHours = item.soakMinutes / 60;
            const soaked = Math.min(hours, capHours);
            const longer = hours > capHours ? ` (anything past ${formatDuration(capHours)} adds nothing, so ${formatDuration(hours)} is fine but not needed)` : '';
            // soakStep replaces the generic wording outright (and its "past the
            // cap adds nothing" aside); a function form gets the capped soak hours
            // so its text can match what the user entered.
            const soakStep = typeof item.soakStep === 'function' ? item.soakStep(soaked) : item.soakStep;
            steps.push(soakStep
                || `Soak in plenty of cold water for ${formatDuration(soaked)}${longer}, then drain and discard the soaking water.`);
        }
        if (item.toxinBoil) {
            steps.push('Cover with fresh water and boil hard, uncovered, for 10 minutes (on Sauté or the stove) to destroy natural toxins, then drain.');
        }
        if (parCookActive(item, hours)) steps.push(item.parCook.step);
        if (item.methodPreCook) steps.push(...asSteps(item.methodPreCook));
        const liquidWord = liquid ? liquid.label.toLowerCase() : 'water';
        const waterText = unit === 'mL'
            ? `${water} mL`
            : `${formatWater(water, unit)} ${WATER_UNITS.find((u) => u.id === unit).label} (${water} mL)`;
        steps.push(`Add the ${ingredientLabel} to the Instant Pot with ${waterText} ${liquidWord}.`);
        steps.push('Close the lid and set the valve to Sealing.');
        steps.push(`Cook on High Pressure for ${time} min.`);
        const release = activeRelease(item, hours);
        steps.push(RELEASE_INSTRUCTIONS[release] || `Release: ${release}.`);
        steps.push(...asSteps(item.methodOutro || category.defaultOutro || 'Fluff with a fork and serve.'));
        return steps;
    };

    // Wash calculator: enough water to submerge the produce (~1mL per gram, 500mL
    // floor for a small batch), bicarb scaled to the same ~1 tsp per 2 cups ratio
    // used in the cleaning steps above.
    const WASH_WATER_MIN_ML = 500;
    const computeWash = (grams) => {
        const waterMl = Math.max(WASH_WATER_MIN_ML, Math.ceil(grams / 50) * 50);
        const bicarbTsp = Math.round((waterMl / 500) * 2) / 2;
        return { waterMl, bicarbTsp };

    };

    const categoryGrid = document.getElementById('category-grid');

    const STORAGE_KEY = 'ipcalc-state-v1';

    const UNIT_BTN_BASE = 'px-3 py-1 rounded-full text-xs font-bold border-2 transition-colors';

    function renderPrepGuide(item) {

        const unitBtnClass = (active) => `${UNIT_BTN_BASE} ${active

            : 'bg-gray-50 text-gray-500 border-gray-200 hover:bg-gray-100'}`;
        const makeTab = (id, label) => {
            const btn = document.createElement('button');
            btn.type = 'button';

            btn.addEventListener('click', () => { selectedMethodId = id; render(); });
            prepMethodTabs.appendChild(btn);
        };
        makeTab(null, 'Overview');
        g.methods.forEach((m) => makeTab(m.id, m.label));

        const methodsToShow = selectedMethodId === null
            ? g.methods
            : g.methods.filter((m) => m.id === selectedMethodId);
        prepSteps.innerHTML = methodsToShow.map((m) => `
            <div>
                <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">${m.label}</h4>
                <ol class="list-decimal list-inside space-y-1.5 text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded-xl p-4">
                    ${m.steps.map((s) => `<li>${s}</li>`).join('')}
                </ol>
            </div>`).join('');
    }

    // --- Collapsible sections ---
    const sectionExpanded = {
        category: true, weight: true, type: true, soak: true, prepguide: true, results: true, method: false,
    };

    function applySectionState(id) {
        const body = document.getElementById(`section-${id}`);
        const chevron = document.querySelector(`.section-toggle[data-section="${id}"] .chevron`);
        const expanded = sectionExpanded[id];

    }

    document.querySelectorAll('.section-toggle').forEach((btn) => {
        const id = btn.dataset.section;
        btn.addEventListener('click', () => {
            sectionExpanded[id] = !sectionExpanded[id];
            applySectionState(id);

    });

    Object.keys(sectionExpanded).forEach(applySectionState);

    // --- Category & item pickers ---
    Object.entries(categories).forEach(([id, cat]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.id = id;
        btn.innerHTML = `<span class="text-xl">${cat.icon}</span><span class="text-[11px] leading-tight text-center">${cat.label}</span>`;
        btn.className = 'py-2 px-1 rounded-lg font-bold flex flex-col items-center gap-1 transition-all border-2';
        btn.addEventListener('click', () => {
            currentCategory = id;
            currentItemId = Object.keys(categories[id].items)[0];
            soakHours = (currentItem().defaultSoakMinutes || 0) / 60;
            selectedMethodId = null;
            selectedLiquidId = currentItem().liquidOptions ? currentItem().liquidOptions.recommended : null;
            render();
        });
        categoryGrid.appendChild(btn);
    });

    let itemGridCategory = null;

    function renderItemGrid() {
        itemGrid.innerHTML = '';
        Object.entries(categories[currentCategory].items).forEach(([id, item]) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.dataset.id = id;
            btn.innerHTML = `<span class="text-2xl">${item.icon}</span>${item.label}`;
            btn.addEventListener('click', () => {
                currentItemId = id;
                soakHours = (item.defaultSoakMinutes || 0) / 60;
                selectedMethodId = null;
                selectedLiquidId = item.liquidOptions ? item.liquidOptions.recommended : null;
                render();
            });
            itemGrid.appendChild(btn);
        });
        itemGridCategory = currentCategory;
    }

    // --- Weight input ---
    weightInput.addEventListener('input', (e) => {
        const typed = Math.max(0, parseFloat(e.target.value) || 0);
        weight = displayToGrams(typed, weightUnit, currentItem());
        render();
    });
    weightInput.addEventListener('blur', () => {
        weightInput.value = formatWeight(weight, weightUnit, currentItem());
    });

    copyMethodBtn.addEventListener('click', async () => {
        const item = currentItem();
        const lines = [...methodList.querySelectorAll('li')].map((li, i) => `${i + 1}. ${li.textContent}`);
        const text = `${item.label}, ${Math.round(weight)} g dry\n${lines.join('\n')}`;
        try {
            await navigator.clipboard.writeText(text);
            copyMethodBtn.textContent = '✅ Copied';
        } catch (e) {
            copyMethodBtn.textContent = '⚠️ Copy not available';
        }
        setTimeout(() => { copyMethodBtn.textContent = '📋 Copy method'; }, 1500);
    });

    // --- Soak hours: typed input, +/- stepper, and reset ---
    const roundHours = (h) => Math.max(0, Math.round(h * 100) / 100);

    soakInput.addEventListener('input', (e) => {
        soakHours = clampHours(parseFloat(e.target.value));
        render();
    });
    soakInput.addEventListener('blur', () => { soakInput.value = roundHours(soakHours); });

    soakDecBtn.addEventListener('click', () => {
        soakHours = clampHours(roundHours(soakHours - SOAK_STEP));
        render();
    });

    soakIncBtn.addEventListener('click', () => {
        soakHours = clampHours(roundHours(soakHours + SOAK_STEP));
        render();
    });

    soakResetBtn.addEventListener('click', () => {
        soakHours = currentItem().defaultSoakMinutes / 60;
        render();
    });

    function render() {
        const item = currentItem();

        const catBase = 'py-2 px-1 rounded-lg font-bold flex flex-col items-center gap-1 transition-all border-2';
        categoryGrid.querySelectorAll('button').forEach((btn) => {
            const active = btn.dataset.id === currentCategory;
            btn.setAttribute('aria-pressed', String(active));
            btn.className = active
                ? `${catBase} bg-blue-100 text-blue-800 border-blue-600 shadow-sm`
                : `${catBase} bg-gray-50 text-gray-500 border-transparent hover:bg-gray-100`;
        });

        if (itemGridCategory !== currentCategory) {
            renderItemGrid();
        }
        const itemBase = 'py-3 px-2 rounded-xl font-bold text-sm flex flex-col items-center gap-1 transition-all border-2';
        itemGrid.querySelectorAll('button').forEach((btn) => {
            const active = btn.dataset.id === currentItemId;
            btn.setAttribute('aria-pressed', String(active));
            btn.className = active
                ? `${itemBase} bg-blue-100 text-blue-800 border-blue-600 shadow-sm`
                : `${itemBase} bg-gray-50 text-gray-500 border-transparent hover:bg-gray-100`;
        });

        saveState();

        weightLabel.textContent = weightLabelFor(currentCategory);
        itemLabel.textContent = itemLabelFor(currentCategory);

        const prepMode = isPrepItem(item);
        blockWeight.classList.toggle('hidden', prepMode);
        blockSoak.classList.toggle('hidden', prepMode);
        blockResults.classList.toggle('hidden', prepMode);
        blockMethod.classList.toggle('hidden', prepMode);
        blockPrepGuide.classList.toggle('hidden', !prepMode);

        if (prepMode) {
            renderPrepGuide(item);
            return;
        }

        // Only rewrite the input when the user isn't typing in it, otherwise
        // "1." becomes "1.00" mid-keystroke in oz/cup mode.
        if (document.activeElement !== weightInput) {
            weightInput.value = formatWeight(weight, weightUnit, item);
        }
        const unitBtnClass = (active) => `${UNIT_BTN_BASE} ${active
            ? 'bg-blue-600 text-white border-blue-600'
            : 'bg-gray-50 text-gray-500 border-gray-200 hover:bg-gray-100'}`;
        weightUnitToggle.querySelectorAll('button').forEach((btn) => {
            btn.className = unitBtnClass(btn.dataset.unit === weightUnit);
        });
        waterUnitToggle.querySelectorAll('button').forEach((btn) => {
            btn.className = unitBtnClass(btn.dataset.unit === waterUnit);
        });

        if (item.soak) {
            soakControls.classList.remove('hidden');
            soakLabel.textContent = 'Soak Time (hours)';
            if (document.activeElement !== soakInput) soakInput.value = roundHours(soakHours);
            const capHours = item.soakMinutes / 60;
            if (soakHours > capHours) {
                soakCapNote.textContent = `Benefit caps at ${formatDuration(capHours)}; longer soaks change nothing here.`;
                soakCapNote.classList.remove('hidden');
            } else {
                soakCapNote.classList.add('hidden');
            }
        } else {
            soakControls.classList.add('hidden');
            soakLabel.textContent = 'Notes';
        }

        noteEl.textContent = item.note || '';

        if (item.warning) {
            warningEl.textContent = item.warning;
            warningEl.classList.remove('hidden');
        } else {
            warningEl.classList.add('hidden');
        }

        const liquid = selectedLiquidChoice(item, selectedLiquidId);
        if (item.liquidOptions) {
            liquidSelect.classList.remove('hidden');
            liquidToggle.innerHTML = '';
            item.liquidOptions.choices.forEach((choice) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                const isRecommended = choice.id === item.liquidOptions.recommended;
                btn.textContent = isRecommended ? `⭐ ${choice.label}` : choice.label;
                btn.className = unitBtnClass(selectedLiquidId === choice.id);
                btn.addEventListener('click', () => { selectedLiquidId = choice.id; render(); });
                liquidToggle.appendChild(btn);
            });
        } else {
            liquidSelect.classList.add('hidden');
        }

        const water = calculateWater(weight, item, soakHours);
        const time = activeTime(item, soakHours);

        document.getElementById('water').textContent = formatWater(water, waterUnit);
        waterUnitLabel.textContent = WATER_UNITS.find((u) => u.id === waterUnit).label;
        waterLabelEl.textContent = liquid ? `Add ${liquid.label}` : 'Add Water';
        const release = activeRelease(item, soakHours);
        document.getElementById('time').textContent = time;
        totalTimeEl.textContent = parCookActive(item, soakHours)
            ? `≈ ${estimateTotalMinutes(release, water, time) + item.parCook.minutes} min total incl. par-cook, pressurising & release`
            : `≈ ${estimateTotalMinutes(release, water, time)} min total incl. pressurising & release`;
        document.getElementById('release').textContent = release;

        if (water > 0 && water < MIN_LIQUID_ML) {
            liquidWarningEl.textContent = `⚠️ ${water} mL is under the ~${MIN_LIQUID_ML} mL an Instant Pot needs to reach pressure. Cook a bigger batch, or use pot-in-pot with 250 mL water in the outer pot.`;
            liquidWarningEl.classList.remove('hidden');
        } else if (water + weight > HALF_FULL_ML) {
            liquidWarningEl.textContent = '⚠️ This batch is over the half-full line of a 6 qt pot. Foamy grains and pulses expand a lot, so split it into two batches.';
            liquidWarningEl.classList.remove('hidden');
        } else {
            liquidWarningEl.classList.add('hidden');
        }
        document.getElementById('ratio').textContent = `Ratio 1 : ${activeRatio(item, soakHours).toFixed(2)} (dry : water)`;

        methodList.innerHTML = '';
        generateMethodSteps(item, categories[currentCategory], water, time, soakHours, liquid, waterUnit).forEach((step) => {
            const li = document.createElement('li');
            li.textContent = step;
            methodList.appendChild(li);
        });
    }

    render();
</script>
</body>
</html>

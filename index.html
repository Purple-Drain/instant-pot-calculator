<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
    <title>Instant Pot Calculator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍲</text></svg>">
    <link rel="manifest" href='data:application/json,%7B"name":"Instant%20Pot%20Calculator","short_name":"IP%20Calc","start_url":"./index.html","display":"standalone","background_color":"%23f3f4f6","theme_color":"%232563eb"%7D'>

    <style>
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in 0.15s ease-out; }
        /* Hide number-input spinners so the big centred figure stays centred. */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .chevron { display: inline-block; transition: transform 0.15s ease-out; }
        .section-body.hidden { display: none; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 text-gray-900 p-4 font-sans flex justify-center items-start pt-6 sm:pt-10">

    <div class="bg-white rounded-2xl shadow-lg w-full max-w-md overflow-hidden pb-4">
        <div class="bg-blue-600 text-white p-5 text-center">
            <h1 class="text-xl font-bold flex items-center justify-center gap-2 tracking-wide">
                <span>🍲</span> INSTANT POT CALCULATOR
            </h1>
        </div>

        <div class="p-5 space-y-5">
            <div class="space-y-2">
                <button type="button" data-section="category" class="section-toggle w-full flex items-center justify-between text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <span>Category</span>
                    <span class="chevron">▾</span>
                </button>
                <div id="section-category" class="section-body">
                    <div id="category-grid" class="grid grid-cols-3 gap-2"></div>
                </div>
            </div>

            <div class="space-y-2" id="block-weight">
                <button type="button" data-section="weight" class="section-toggle w-full flex items-center justify-between text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <span id="weight-label">Dry Weight (grams)</span>
                    <span class="chevron">▾</span>
                </button>
                <div id="section-weight" class="section-body">
                    <input id="weight" type="number" inputmode="decimal" value="300" placeholder="0"
                        autocomplete="off"
                        class="w-full text-5xl font-black text-center text-blue-900 border-b-2 border-gray-200 focus:border-blue-600 outline-none pb-2 transition-colors">
                    <div id="weight-unit-toggle" class="flex justify-center gap-2 mt-2"></div>
                </div>
            </div>

            <div class="space-y-2">
                <button type="button" data-section="type" class="section-toggle w-full flex items-center justify-between text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <span id="item-label">Type</span>
                    <span class="chevron">▾</span>
                </button>
                <div id="section-type" class="section-body">
                    <div id="item-grid" class="grid grid-cols-2 gap-3 mt-3"></div>
                </div>
            </div>

            <div class="space-y-2" id="block-soak">
                <button type="button" data-section="soak" class="section-toggle w-full flex items-center justify-between text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <span>Soak Time</span>
                    <span class="chevron">▾</span>
                </button>
                <div id="section-soak" class="section-body space-y-2 animate-fade-in">
                    <div id="soak-controls">
                        <div class="flex items-center justify-center gap-3">
                            <button id="soak-dec" type="button" aria-label="Decrease soak time"
                                class="w-11 h-11 shrink-0 rounded-full border-2 border-gray-200 text-xl font-bold text-gray-500 hover:bg-gray-50 transition-colors">−</button>
                            <input id="soak-hours" type="number" inputmode="decimal" step="0.5" min="0" value="0" placeholder="0"
                                autocomplete="off"
                                class="w-24 text-3xl font-black text-center text-blue-900 border-b-2 border-gray-200 focus:border-blue-600 outline-none pb-2 transition-colors">
                            <button id="soak-inc" type="button" aria-label="Increase soak time"
                                class="w-11 h-11 shrink-0 rounded-full border-2 border-gray-200 text-xl font-bold text-gray-500 hover:bg-gray-50 transition-colors">+</button>
                        </div>
                        <div class="text-center mt-1">
                            <button id="soak-reset" type="button" class="text-xs font-bold text-blue-600 hover:text-blue-800 underline underline-offset-2">
                                ↺ Reset to recommended
                            </button>
                        </div>
                    </div>
                    <div id="note" class="text-xs font-semibold text-slate-500 text-center px-1"></div>
                    <div id="warning" class="hidden text-xs font-bold text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-3 text-center"></div>
                </div>
            </div>

            <div class="space-y-2 hidden" id="block-prepguide">
                <button type="button" data-section="prepguide" class="section-toggle w-full flex items-center justify-between text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <span>Prep Guide</span>
                    <span class="chevron">▾</span>
                </button>
                <div id="section-prepguide" class="section-body space-y-4">
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
                        <div class="text-xs font-bold text-slate-500 uppercase tracking-wider">Bicarb Wash Calculator</div>
                        <div class="flex items-center justify-center gap-2">
                            <label for="prep-wash-weight" class="sr-only">Produce weight in grams</label>
                            <input id="prep-wash-weight" type="number" inputmode="decimal" min="50" step="50" value="500"
                                autocomplete="off" aria-label="Produce weight in grams"
                                class="w-24 text-2xl font-black text-center text-blue-900 border-b-2 border-gray-200 focus:border-blue-600 outline-none pb-1 transition-colors">
                            <span class="text-sm font-semibold text-slate-500">g produce</span>
                        </div>
                        <label for="prep-wash-slider" class="sr-only">Produce weight slider</label>
                        <input id="prep-wash-slider" type="range" min="100" max="3000" step="50" value="500" class="w-full accent-blue-600" aria-label="Produce weight slider">
                        <div class="grid grid-cols-2 gap-3 text-center">
                            <div>
                                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Wash Water</div>
                                <div id="prep-wash-water" class="text-lg font-black text-blue-600">500 mL</div>
                            </div>
                            <div>
                                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Bicarb Soda</div>
                                <div id="prep-wash-bicarb" class="text-lg font-black text-slate-800">1 tsp</div>
                            </div>
                        </div>
                        <div class="text-xs text-slate-400 text-center">~1 tsp bicarb per 2 cups (500mL) water, enough to submerge — adjust for your bowl size.</div>
                    </div>
                    <div id="prep-cleaning"></div>
                    <div id="prep-destarch"></div>
                    <div id="prep-method-tabs" class="flex flex-wrap gap-2"></div>
                    <div id="prep-steps" class="space-y-4"></div>
                </div>
            </div>

            <hr class="border-gray-100">

            <div class="space-y-2" id="block-results">
                <button type="button" data-section="results" class="section-toggle w-full flex items-center justify-between text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <span>Results</span>
                    <span class="chevron">▾</span>
                </button>
                <div id="section-results" class="section-body">
                    <div class="bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-4 shadow-inner">
                        <div id="liquid-select" class="hidden pb-3 border-b border-slate-200">
                            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 text-center">Cooking Liquid</div>
                            <div id="liquid-toggle" class="flex justify-center gap-2 flex-wrap"></div>
                        </div>
                        <div class="flex justify-between items-end border-b border-slate-200 pb-3">
                            <div>
                                <div id="water-label" class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Add Water</div>
                                <div class="flex items-center gap-2">
                                    <span class="text-2xl">💧</span>
                                    <span id="water" class="text-4xl font-black text-blue-600">0</span>
                                    <span id="water-unit-label" class="text-lg font-bold text-blue-400 mb-1">mL</span>
                                </div>
                                <div id="water-unit-toggle" class="flex gap-2 mt-1"></div>
                                <div id="ratio" class="text-xs font-semibold text-slate-400 mt-1"></div>
                            </div>
                        </div>
                        <div class="flex justify-between items-end border-b border-slate-200 pb-3">
                            <div>
                                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">High Pressure</div>
                                <div class="flex items-center gap-2">
                                    <span class="text-2xl">⏱️</span>
                                    <span id="time" class="text-4xl font-black text-slate-800">0</span>
                                    <span class="text-lg font-bold text-slate-400 mb-1">min</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex justify-between items-center pt-1">
                            <div>
                                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Release Method</div>
                                <div class="flex items-center gap-2">
                                    <span class="text-2xl">💨</span>
                                    <span id="release" class="text-xl font-bold text-slate-700">10 Min NPR</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-2" id="block-method">
                <button type="button" data-section="method" class="section-toggle w-full flex items-center justify-between text-xs font-bold text-gray-500 uppercase tracking-wider">
                    <span>Method</span>
                    <span class="chevron">▾</span>
                </button>
                <div id="section-method" class="section-body">
                    <ol id="method-list" class="list-decimal list-inside space-y-1.5 text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded-xl p-4"></ol>
                </div>
            </div>
        </div>
    </div>

<script>

    // soakMinutes, but can be lower when soaking is optional rather than the
    // traditional/recommended default (see Mujaddara).
    // methodIntro/methodOutro = optional extra steps prepended/appended to the
    // generic pressure-cooking method (e.g. caramelizing onions for Mujaddara).
    // skipRinse = true skips the generic "rinse" step (oats don't need it).
    // gramsPerCup = approximate weight of 1 US cup of this dry ingredient, only
    // used to convert the weight input to/from "cup" units (water needs no such
    // figure since it's converted by pure volume/mass math).

                            },
                            {
                                id: 'curry', label: 'Curry',
                                steps: [
                                    'Peel and cut into 2–3cm cubes — no destarch soak needed.',
                                    'Add directly to the curry sauce (sweet potato cooks fast and holds its shape).',
                                    'Simmer 15–20 min until tender.',
                                ],
                            },
                            {
                                id: 'soup', label: 'Soup',
                                steps: [
                                    'Peel and cube.',
                                    'Simmer in stock 15–20 min until tender.',
                                    'Blend until smooth.',
                                ],
                            },
                        ],
                    },
                },
                'apple': {
                    label: 'Apple', icon: '🍎',
                    prepGuide: {
                        cleaning: [
                            'Rinse under cold water, rubbing off any wax or residue.',
                            'For a deeper clean, wash in a diluted bicarbonate-of-soda solution (1 tsp bicarb per 2 cups/500mL water) for 12–15 min, then rinse well — cuts surface bacteria and pesticide residue better than water alone (worth it if the skin is staying on).',
                            'Peel with a vegetable peeler if the method wants it (skin-on is fine once cooked soft/blended).',
                            'Core with a corer or knife: quarter, then cut out the core from each wedge.',
                            'To stop cut apple browning, toss slices in water with 1 tbsp lemon juice per cup while you prep the rest.',
                        ],
                        destarch: null,
                        methods: [
                            {
                                id: 'sauce', label: 'Apple Sauce',
                                steps: [
                                    'Peel, core, and chop into chunks.',
                                    'Simmer in a splash of water or apple juice with cinnamon/sugar to taste, covered, 15–20 min until very soft.',
                                    'Mash or blend to the texture you want.',
                                ],
                            },
                            {
                                id: 'pie', label: 'Pie Filling',
                                steps: [
                                    'Peel, core, and slice thinly (~5mm).',
                                    'Toss with sugar, cinnamon, lemon juice, and a thickener (cornstarch or flour); let macerate 15 min.',
                                    'Fill the pastry and bake at 190–200°C (375–400°F) 40–50 min until bubbling and the apples are tender.',
                                ],
                            },
                            {
                                id: 'baked', label: 'Baked Whole',
                                steps: [
                                    'Core whole apples, leaving them intact; score the skin around the middle.',
                                    'Stuff the cavity with butter, sugar, cinnamon, and (optionally) chopped nuts.',
                                    'Bake at 180°C (350°F) 30–40 min until tender.',
                                ],
                            },
                        ],
                    },
                },
            },
        },
    };

    // Produce items carry a `prepGuide` instead of ratio/time/release/soak — they
    // aren't pressure-cook ratios at all, so render() branches into renderPrepGuide()
    // for them rather than forcing fake values through the ratio-based path.
    const isPrepItem = (item) => !!item.prepGuide;

    const RELEASE_INSTRUCTIONS = {
        '10 Min NPR': 'Let the pressure release naturally for 10 minutes, then quick-release any remainder.',
        '15 Min NPR': 'Let the pressure release naturally for 15 minutes, then quick-release any remainder.',
        'Quick Release': 'Use Quick Release to vent the pressure as soon as cooking finishes.',
        'Full NPR': 'Let the pressure release fully and naturally — do not quick-release. Congee foams as it cooks, and releasing early or quickly can spit hot starchy liquid through the valve; a full natural release (roughly 15–25 min) is the safe way to vent.',
    };

    const SOAK_STEP = 0.5;

    let weight = 300;
    let currentCategory = 'rice';
    let currentItemId = 'white-basmati';

    const currentItem = () => categories[currentCategory].items[currentItemId];

    let soakHours = (currentItem().defaultSoakMinutes || 0) / 60;
    let selectedMethodId = null;
    let selectedLiquidId = currentItem().liquidOptions ? currentItem().liquidOptions.recommended : null;

    const soakFraction = (item, hours) => {
        if (!item.soak || item.soakMinutes <= 0) return 0;
        const capHours = item.soakMinutes / 60;
        return Math.min(hours, capHours) / capHours;
    };

    const activeRatio = (item, hours) => {
        if (!item.soak) return item.ratio;
        const f = soakFraction(item, hours);
        return item.ratio + (item.soak.ratio - item.ratio) * f;
    };

    const activeTime = (item, hours) => {
        if (!item.soak) return item.time;
        const f = soakFraction(item, hours);
        return Math.round(item.time + (item.soak.time - item.time) * f);
    };

    const calculateWater = (w, item, hours) => {
        if (!w || w <= 0) return 0;
        return Math.round((w * activeRatio(item, hours)) / 10) * 10;
    };

    const weightLabelFor = (categoryId) => {
        if (categoryId === 'combo') return 'Combined Dry Weight — Lentils + Rice, 1:1';
        if (categoryId === 'congee') return 'Dry Rice Weight (for Congee)';
        return `Dry ${categories[categoryId].label} Weight`;
    };

    const selectedLiquidChoice = (item, id) => {
        if (!item.liquidOptions) return null;
        return item.liquidOptions.choices.find((c) => c.id === id)
            || item.liquidOptions.choices.find((c) => c.id === item.liquidOptions.recommended);
    };

    const itemLabelFor = (categoryId) => (categoryId === 'combo' ? 'Dish' : `${categories[categoryId].label} Type`);

    // --- Unit conversion (display/input boundary only — `weight` stays canonical
    // in grams and `water` stays canonical in mL throughout the rest of the app) ---
    const GRAMS_PER_OZ = 28.3495;
    const ML_PER_CUP = 236.588;
    const ML_PER_FLOZ = 29.5735;

    const WEIGHT_UNITS = [
        { id: 'g', label: 'g' },
        { id: 'oz', label: 'oz' },
        { id: 'cup', label: 'cup' },
    ];
    const WATER_UNITS = [
        { id: 'mL', label: 'mL' },
        { id: 'cup', label: 'cup' },
        { id: 'floz', label: 'fl oz' },
    ];

    const gramsToDisplay = (grams, unit, item) => {
        if (unit === 'oz') return grams / GRAMS_PER_OZ;
        if (unit === 'cup') return grams / item.gramsPerCup;
        return grams;
    };

    const displayToGrams = (value, unit, item) => {
        if (unit === 'oz') return value * GRAMS_PER_OZ;
        if (unit === 'cup') return value * item.gramsPerCup;
        return value;
    };

    const mlToDisplay = (ml, unit) => {
        if (unit === 'cup') return ml / ML_PER_CUP;
        if (unit === 'floz') return ml / ML_PER_FLOZ;
        return ml;
    };

    const formatWeight = (grams, unit, item) => {
        const v = gramsToDisplay(grams, unit, item);
        return unit === 'g' ? String(Math.round(v)) : v.toFixed(2);
    };

    const formatWater = (ml, unit) => {
        const v = mlToDisplay(ml, unit);
        if (unit === 'mL') return String(Math.round(v));
        return unit === 'floz' ? v.toFixed(1) : v.toFixed(2);
    };

    const generateMethodSteps = (item, water, time, hours, liquid) => {
        const steps = [];
        const ingredientLabel = (item.ingredientLabel || item.label).toLowerCase();
        if (item.methodIntro) steps.push(...item.methodIntro);
        if (!item.skipRinse) {
            steps.push(`Rinse the dry ${ingredientLabel} under cold water until it runs clear.`);
        }
        if (item.soak && hours > 0) {
            const hrsText = hours === 1 ? '1 hr' : `${hours} hrs`;
            steps.push(`Soak in water for ${hrsText}, then drain.`);
        }
        if (item.toxinBoil) {
            steps.push('Boil hard, uncovered, for 10 minutes to neutralize natural toxins, then proceed.');
        }
        const liquidWord = liquid ? liquid.label.toLowerCase() : 'water';
        steps.push(`Add the ${ingredientLabel} to the Instant Pot with ${water} mL ${liquidWord}.`);
        steps.push('Close the lid and set the valve to Sealing.');
        steps.push(`Cook on High Pressure for ${time} min.`);
        steps.push(RELEASE_INSTRUCTIONS[item.release] || `Release: ${item.release}.`);
        steps.push(item.methodOutro || 'Fluff with a fork and serve.');
        return steps;
    };

    // Wash calculator: enough water to submerge the produce (~1mL per gram, 500mL
    // floor for a small batch), bicarb scaled to the same ~1 tsp per 2 cups ratio
    // used in the cleaning steps above.
    const WASH_WATER_MIN_ML = 500;
    const computeWash = (grams) => {
        const waterMl = Math.max(WASH_WATER_MIN_ML, Math.ceil(grams / 50) * 50);
        const bicarbTsp = Math.round((waterMl / 500) * 2) / 2;
        return { waterMl, bicarbTsp };
    };

    const buildPrepList = (heading, lines) => {
        if (!lines) return '';
        const items = lines.map((l) => `<li>${l}</li>`).join('');
        return `<h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">${heading}</h4>
                 <ul class="list-disc list-inside text-sm text-slate-700 space-y-1">${items}</ul>`;
    };

    const categoryGrid = document.getElementById('category-grid');
    const itemGrid = document.getElementById('item-grid');
    const weightInput = document.getElementById('weight');
    const weightLabel = document.getElementById('weight-label');
    const weightUnitToggle = document.getElementById('weight-unit-toggle');
    const itemLabel = document.getElementById('item-label');
    const soakControls = document.getElementById('soak-controls');
    const soakInput = document.getElementById('soak-hours');
    const soakDecBtn = document.getElementById('soak-dec');
    const soakIncBtn = document.getElementById('soak-inc');
    const soakResetBtn = document.getElementById('soak-reset');
    const noteEl = document.getElementById('note');
    const warningEl = document.getElementById('warning');
    const liquidSelect = document.getElementById('liquid-select');
    const liquidToggle = document.getElementById('liquid-toggle');
    const waterLabelEl = document.getElementById('water-label');
    const methodList = document.getElementById('method-list');
    const waterUnitToggle = document.getElementById('water-unit-toggle');
    const waterUnitLabel = document.getElementById('water-unit-label');
    const blockWeight = document.getElementById('block-weight');
    const blockSoak = document.getElementById('block-soak');
    const blockResults = document.getElementById('block-results');
    const blockMethod = document.getElementById('block-method');
    const blockPrepGuide = document.getElementById('block-prepguide');
    const prepCleaning = document.getElementById('prep-cleaning');
    const prepDestarch = document.getElementById('prep-destarch');
    const prepMethodTabs = document.getElementById('prep-method-tabs');
    const prepSteps = document.getElementById('prep-steps');
    const prepWashWeightInput = document.getElementById('prep-wash-weight');
    const prepWashSlider = document.getElementById('prep-wash-slider');
    const prepWashWaterEl = document.getElementById('prep-wash-water');
    const prepWashBicarbEl = document.getElementById('prep-wash-bicarb');

    let weightUnit = 'g';
    let waterUnit = 'mL';
    let prepWashWeight = 500;

    const UNIT_BTN_BASE = 'px-3 py-1 rounded-full text-xs font-bold border-2 transition-colors';

    const buildUnitToggle = (container, units, onSelect) => {
        units.forEach((u) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.dataset.unit = u.id;
            btn.textContent = u.label;
            btn.addEventListener('click', () => {
                onSelect(u.id);
                render();
            });
            container.appendChild(btn);
        });
    };

    buildUnitToggle(weightUnitToggle, WEIGHT_UNITS, (id) => { weightUnit = id; });
    buildUnitToggle(waterUnitToggle, WATER_UNITS, (id) => { waterUnit = id; });

    prepWashWeightInput.addEventListener('input', (e) => {
        prepWashWeight = Math.max(0, parseFloat(e.target.value) || 0);
        prepWashSlider.value = Math.min(3000, Math.max(100, prepWashWeight));
        render();
    });

    prepWashSlider.addEventListener('input', (e) => {
        prepWashWeight = parseFloat(e.target.value) || 0;
        prepWashWeightInput.value = prepWashWeight;
        render();
    });

    function renderPrepGuide(item) {
        const g = item.prepGuide;

        const { waterMl, bicarbTsp } = computeWash(prepWashWeight);
        prepWashWaterEl.textContent = `${waterMl} mL (~${(waterMl / ML_PER_CUP).toFixed(1)} cups)`;
        prepWashBicarbEl.textContent = `${bicarbTsp} tsp`;

        prepCleaning.innerHTML = buildPrepList('Cleaning', g.cleaning);
        prepDestarch.innerHTML = buildPrepList('Destarch (cold-water soak)', g.destarch);

        prepMethodTabs.innerHTML = '';
        const unitBtnClass = (active) => `${UNIT_BTN_BASE} ${active
            ? 'bg-blue-600 text-white border-blue-600'
            : 'bg-gray-50 text-gray-500 border-gray-200 hover:bg-gray-100'}`;
        const makeTab = (id, label) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = label;
            btn.className = unitBtnClass(selectedMethodId === id);
            btn.addEventListener('click', () => { selectedMethodId = id; render(); });
            prepMethodTabs.appendChild(btn);
        };
        makeTab(null, 'Overview');
        g.methods.forEach((m) => makeTab(m.id, m.label));

        const methodsToShow = selectedMethodId === null
            ? g.methods
            : g.methods.filter((m) => m.id === selectedMethodId);
        prepSteps.innerHTML = methodsToShow.map((m) => `
            <div>
                <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">${m.label}</h4>
                <ol class="list-decimal list-inside space-y-1.5 text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded-xl p-4">
                    ${m.steps.map((s) => `<li>${s}</li>`).join('')}
                </ol>
            </div>`).join('');
    }

    // --- Collapsible sections ---
    const sectionExpanded = {
        category: true, weight: true, type: true, soak: true, prepguide: true, results: true, method: false,
    };

    function applySectionState(id) {
        const body = document.getElementById(`section-${id}`);
        const chevron = document.querySelector(`.section-toggle[data-section="${id}"] .chevron`);
        const expanded = sectionExpanded[id];
        body.classList.toggle('hidden', !expanded);
        chevron.textContent = expanded ? '▾' : '▸';
    }

    document.querySelectorAll('.section-toggle').forEach((btn) => {
        const id = btn.dataset.section;
        btn.addEventListener('click', () => {
            sectionExpanded[id] = !sectionExpanded[id];
            applySectionState(id);
        });
    });

    Object.keys(sectionExpanded).forEach(applySectionState);

    // --- Category & item pickers ---
    Object.entries(categories).forEach(([id, cat]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.id = id;
        btn.innerHTML = `<span class="text-xl">${cat.icon}</span><span class="text-[11px] leading-tight text-center">${cat.label}</span>`;
        btn.className = 'py-2 px-1 rounded-lg font-bold flex flex-col items-center gap-1 transition-all border-2';
        btn.addEventListener('click', () => {
            currentCategory = id;
            currentItemId = Object.keys(categories[id].items)[0];
            soakHours = (currentItem().defaultSoakMinutes || 0) / 60;
            selectedMethodId = null;
            selectedLiquidId = currentItem().liquidOptions ? currentItem().liquidOptions.recommended : null;
            render();
        });
        categoryGrid.appendChild(btn);
    });

    let itemGridCategory = null;

    function renderItemGrid() {
        itemGrid.innerHTML = '';
        Object.entries(categories[currentCategory].items).forEach(([id, item]) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.dataset.id = id;
            btn.innerHTML = `<span class="text-2xl">${item.icon}</span>${item.label}`;
            btn.addEventListener('click', () => {
                currentItemId = id;
                soakHours = (item.defaultSoakMinutes || 0) / 60;
                selectedMethodId = null;
                selectedLiquidId = item.liquidOptions ? item.liquidOptions.recommended : null;
                render();
            });
            itemGrid.appendChild(btn);
        });
        itemGridCategory = currentCategory;
    }

    // --- Weight input ---
    weightInput.addEventListener('input', (e) => {
        const typed = parseFloat(e.target.value) || 0;
        weight = displayToGrams(typed, weightUnit, currentItem());
        render();
    });

    // --- Soak hours: typed input, +/- stepper, and reset ---
    const roundHours = (h) => Math.max(0, Math.round(h * 100) / 100);

    soakInput.addEventListener('input', (e) => {
        soakHours = parseFloat(e.target.value) || 0;
        render();
    });

    soakDecBtn.addEventListener('click', () => {
        soakHours = roundHours(soakHours - SOAK_STEP);
        render();
    });

    soakIncBtn.addEventListener('click', () => {
        soakHours = roundHours(soakHours + SOAK_STEP);
        render();
    });

    soakResetBtn.addEventListener('click', () => {
        soakHours = currentItem().defaultSoakMinutes / 60;
        render();
    });

    function render() {
        const item = currentItem();

        const catBase = 'py-2 px-1 rounded-lg font-bold flex flex-col items-center gap-1 transition-all border-2';
        categoryGrid.querySelectorAll('button').forEach((btn) => {
            btn.className = btn.dataset.id === currentCategory
                ? `${catBase} bg-blue-100 text-blue-800 border-blue-600 shadow-sm`
                : `${catBase} bg-gray-50 text-gray-500 border-transparent hover:bg-gray-100`;
        });

        if (itemGridCategory !== currentCategory) {
            renderItemGrid();
        }
        const itemBase = 'py-3 px-2 rounded-xl font-bold text-sm flex flex-col items-center gap-1 transition-all border-2';
        itemGrid.querySelectorAll('button').forEach((btn) => {
            btn.className = btn.dataset.id === currentItemId
                ? `${itemBase} bg-blue-100 text-blue-800 border-blue-600 shadow-sm`
                : `${itemBase} bg-gray-50 text-gray-500 border-transparent hover:bg-gray-100`;
        });

        weightLabel.textContent = weightLabelFor(currentCategory);
        itemLabel.textContent = itemLabelFor(currentCategory);

        const prepMode = isPrepItem(item);
        blockWeight.classList.toggle('hidden', prepMode);
        blockSoak.classList.toggle('hidden', prepMode);
        blockResults.classList.toggle('hidden', prepMode);
        blockMethod.classList.toggle('hidden', prepMode);
        blockPrepGuide.classList.toggle('hidden', !prepMode);

        if (prepMode) {
            renderPrepGuide(item);
            return;
        }

        weightInput.value = formatWeight(weight, weightUnit, item);
        const unitBtnClass = (active) => `${UNIT_BTN_BASE} ${active
            ? 'bg-blue-600 text-white border-blue-600'
            : 'bg-gray-50 text-gray-500 border-gray-200 hover:bg-gray-100'}`;
        weightUnitToggle.querySelectorAll('button').forEach((btn) => {
            btn.className = unitBtnClass(btn.dataset.unit === weightUnit);
        });
        waterUnitToggle.querySelectorAll('button').forEach((btn) => {
            btn.className = unitBtnClass(btn.dataset.unit === waterUnit);
        });

        if (item.soak) {
            soakControls.classList.remove('hidden');
            soakInput.value = soakHours;
        } else {
            soakControls.classList.add('hidden');
        }

        noteEl.textContent = item.note || '';

        if (item.warning) {
            warningEl.textContent = item.warning;
            warningEl.classList.remove('hidden');
        } else {
            warningEl.classList.add('hidden');
        }

        const liquid = selectedLiquidChoice(item, selectedLiquidId);
        if (item.liquidOptions) {
            liquidSelect.classList.remove('hidden');
            liquidToggle.innerHTML = '';
            item.liquidOptions.choices.forEach((choice) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                const isRecommended = choice.id === item.liquidOptions.recommended;
                btn.textContent = isRecommended ? `⭐ ${choice.label}` : choice.label;
                btn.className = unitBtnClass(selectedLiquidId === choice.id);
                btn.addEventListener('click', () => { selectedLiquidId = choice.id; render(); });
                liquidToggle.appendChild(btn);
            });
        } else {
            liquidSelect.classList.add('hidden');
        }

        const water = calculateWater(weight, item, soakHours);
        const time = activeTime(item, soakHours);

        document.getElementById('water').textContent = formatWater(water, waterUnit);
        waterUnitLabel.textContent = WATER_UNITS.find((u) => u.id === waterUnit).label;
        waterLabelEl.textContent = liquid ? `Add ${liquid.label}` : 'Add Water';
        document.getElementById('time').textContent = time;
        document.getElementById('release').textContent = item.release;
        document.getElementById('ratio').textContent = `Ratio 1 : ${activeRatio(item, soakHours).toFixed(2)} (dry : water)`;

        methodList.innerHTML = '';
        generateMethodSteps(item, water, time, soakHours, liquid).forEach((step) => {
            const li = document.createElement('li');
            li.textContent = step;
            methodList.appendChild(li);
        });
    }

    render();
</script>
</body>
</html>

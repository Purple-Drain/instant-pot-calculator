<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
    <title>Instant Pot Calculator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍲</text></svg>">
    <link rel="manifest" href='data:application/json,%7B"name":"Instant%20Pot%20Calculator","short_name":"IP%20Calc","start_url":"./index.html","display":"standalone","background_color":"%23f3f4f6","theme_color":"%232563eb"%7D'>

    <style>
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in 0.15s ease-out; }
        /* Hide number-input spinners so the big centred figure stays centred. */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 text-gray-900 p-4 font-sans flex justify-center items-start pt-6 sm:pt-10">

    <div class="bg-white rounded-2xl shadow-lg w-full max-w-md overflow-hidden pb-4">
        <div class="bg-blue-600 text-white p-5 text-center">
            <h1 class="text-xl font-bold flex items-center justify-center gap-2 tracking-wide">
                <span>🍲</span> INSTANT POT CALCULATOR
            </h1>
        </div>

        <div class="p-5 space-y-6">
            <div class="space-y-2">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider text-center mb-3">
                    Category
                </label>
                <div id="category-grid" class="grid grid-cols-3 gap-2"></div>
            </div>

            <div class="space-y-2">
                <label id="weight-label" for="weight" class="block text-xs font-bold text-gray-500 uppercase tracking-wider text-center">
                    Dry Weight (grams)
                </label>
                <input id="weight" type="number" inputmode="numeric" pattern="[0-9]*" value="300" placeholder="0"
                    autocomplete="off"
                    class="w-full text-5xl font-black text-center text-blue-900 border-b-2 border-gray-200 focus:border-blue-600 outline-none pb-2 transition-colors">
            </div>

            <div class="space-y-2">
                <label id="item-label" class="block text-xs font-bold text-gray-500 uppercase tracking-wider text-center mb-3">
                    Type
                </label>
                <div id="item-grid" class="grid grid-cols-2 gap-3"></div>
            </div>

            <div id="soak-wrap" class="space-y-2 pt-2 animate-fade-in">
                <label for="soak-hours" class="block text-xs font-bold text-gray-500 uppercase tracking-wider text-center">
                    Soak Time (hours)
                </label>
                <input id="soak-hours" type="number" inputmode="decimal" step="0.5" min="0" value="0" placeholder="0"
                    autocomplete="off"
                    class="w-full text-3xl font-black text-center text-blue-900 border-b-2 border-gray-200 focus:border-blue-600 outline-none pb-2 transition-colors">
            </div>

            <div id="note" class="text-xs font-semibold text-slate-500 text-center px-1 animate-fade-in"></div>
            <div id="warning" class="hidden text-xs font-bold text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-3 text-center animate-fade-in"></div>

            <hr class="border-gray-100">

            <div class="bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-4 shadow-inner">
                <div class="flex justify-between items-end border-b border-slate-200 pb-3">
                    <div>
                        <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Add Water</div>
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">💧</span>
                            <span id="water" class="text-4xl font-black text-blue-600">0</span>
                            <span class="text-lg font-bold text-blue-400 mb-1">mL</span>
                        </div>
                        <div id="ratio" class="text-xs font-semibold text-slate-400 mt-1"></div>
                    </div>
                </div>
                <div class="flex justify-between items-end border-b border-slate-200 pb-3">
                    <div>
                        <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">High Pressure</div>
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">⏱️</span>
                            <span id="time" class="text-4xl font-black text-slate-800">0</span>
                            <span class="text-lg font-bold text-slate-400 mb-1">min</span>
                        </div>
                    </div>
                </div>
                <div class="flex justify-between items-center pt-1">
                    <div>
                        <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Release Method</div>
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">💨</span>
                            <span id="release" class="text-xl font-bold text-slate-700">10 Min NPR</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    // ratio = mL water per gram of dry weight. time = High Pressure minutes.
    // soakMinutes = point at which soaking's benefit fully caps out (used to
    // interpolate ratio/time between unsoaked and `soak`). defaultSoakMinutes
    // = value the soak-hours input starts at for that item; usually equal to
    // soakMinutes, but can be lower when soaking is optional rather than the
    // traditional/recommended default (see Mujaddara).
    const categories = {
        rice: {
            label: 'Rice', icon: '🍚',
            items: {
                'white-basmati': {
                    label: 'White Basmati', icon: '🍚',
                    ratio: 1.2, time: 4, release: '10 Min NPR',
                    soakMinutes: 30, defaultSoakMinutes: 30,
                    soak: { ratio: 1.05, time: 3 },
                    note: '💧 Soaked 30 min: cuts water & 1 min off cook time, fluffier separate grains',
                },
                'jasmine': {
                    label: 'Jasmine', icon: '🌸',
                    ratio: 1.1, time: 3, release: '10 Min NPR',
                    soakMinutes: 30, defaultSoakMinutes: 0,
                    soak: { ratio: 1.0, time: 2 },
                    note: '💧 Soaking 20–30 min is optional for jasmine: less sticky, 1 min less cook time',
                },
                'brown-basmati': {
                    label: 'Brown Basmati', icon: '🌾',
                    ratio: 1.25, time: 15, release: '10 Min NPR',
                    soakMinutes: 120, defaultSoakMinutes: 120,
                    soak: { ratio: 1.1, time: 12 },
                    note: '💧 Soaked 2+ hrs (recommended): less water, cooks 3 min faster & more evenly',
                },
                'standard-brown': {
                    label: 'Standard Brown', icon: '🟤',
                    ratio: 1.25, time: 22, release: '10 Min NPR',
                    soakMinutes: 120, defaultSoakMinutes: 120,
                    soak: { ratio: 1.1, time: 18 },
                    note: '💧 Soaked 2+ hrs (recommended): less water, cuts 4 min off cook time',
                },
            },
        },
        oats: {
            label: 'Oats', icon: '🌾',
            items: {
                'steel-cut': {
                    label: 'Steel-Cut', icon: '🌾',
                    ratio: 4.0, time: 4, release: '10 Min NPR',
                    soakMinutes: 480, defaultSoakMinutes: 480,
                    soak: { ratio: 3.0, time: 1 },
                    note: '💧 Soaked overnight (8 hrs, recommended): softens the grain, less water & cook time drops from 4 to 1 min',
                },
                'rolled': {
                    label: 'Rolled (Old-Fashioned)', icon: '🥣',
                    ratio: 3.0, time: 1, release: 'Quick Release',
                    soakMinutes: 0, defaultSoakMinutes: 0,
                    soak: null,
                    note: 'No soak needed — rolled oats are already soft; soaking can make them mushy',
                },
            },
        },
        quinoa: {
            label: 'Quinoa', icon: '🌱',
            items: {
                'quinoa': {
                    label: 'Quinoa', icon: '🌱',
                    ratio: 1.4, time: 1, release: 'Quick Release',
                    soakMinutes: 20, defaultSoakMinutes: 20,
                    soak: { ratio: 1.3, time: 1 },
                    note: '💧 Soaking (& rinsing) 20–30 min removes bitterness (saponins) and aids digestion',
                },
            },
        },
        lentils: {
            label: 'Lentils', icon: '🟤',
            items: {
                'red': {
                    label: 'Red (Split)', icon: '🔴',
                    ratio: 2.2, time: 2, release: 'Quick Release',
                    soakMinutes: 0, defaultSoakMinutes: 0,
                    soak: null,
                    note: 'No soak needed — split red lentils cook fast and soften either way',
                },
                'brown-green': {
                    label: 'Brown/Green', icon: '🟤',
                    ratio: 2.2, time: 9, release: '10 Min NPR',
                    soakMinutes: 60, defaultSoakMinutes: 60,
                    soak: { ratio: 2.0, time: 6 },
                    note: '💧 Soaked 1 hr (recommended): cooks faster & more evenly (not strictly required)',
                },
            },
        },
        beans: {
            label: 'Beans', icon: '🫘',
            items: {
                'chickpeas': {
                    label: 'Chickpeas', icon: '🟡',
                    ratio: 3.6, time: 38, release: '15 Min NPR',
                    soakMinutes: 480, defaultSoakMinutes: 480,
                    soak: { ratio: 2.6, time: 13 },
                    note: '💧 Soaked overnight (8 hrs, recommended): time drops from 38 to 13 min, creamier texture',
                },
                'kidney': {
                    label: 'Kidney (Red)', icon: '🔴',
                    ratio: 3.5, time: 35, release: '15 Min NPR',
                    soakMinutes: 480, defaultSoakMinutes: 480,
                    soak: { ratio: 2.5, time: 12 },
                    note: '💧 Soaked overnight (8 hrs, recommended): time drops from 35 to 12 min',
                    warning: '⚠️ Dried kidney beans contain a natural toxin that only a full rolling boil destroys. After soaking, boil hard (uncovered) 10 min before pressure cooking — do not rely on pressure cooking alone.',
                },
                'cannellini': {
                    label: 'Cannellini', icon: '⚪',
                    ratio: 3.5, time: 35, release: '15 Min NPR',
                    soakMinutes: 480, defaultSoakMinutes: 480,
                    soak: { ratio: 2.5, time: 12 },
                    note: '💧 Soaked overnight (8 hrs, recommended): time drops from 35 to 12 min',
                    warning: '⚠️ Same bean family as kidney beans — after soaking, boil hard (uncovered) 10 min before pressure cooking to neutralize natural toxins.',
                },
                'black': {
                    label: 'Black Beans', icon: '⚫',
                    ratio: 3.3, time: 22, release: '15 Min NPR',
                    soakMinutes: 480, defaultSoakMinutes: 480,
                    soak: { ratio: 2.4, time: 10 },
                    note: '💧 Soaked overnight (8 hrs, recommended): time drops from 22 to 10 min',
                },
                'pinto': {
                    label: 'Pinto Beans', icon: '🟤',
                    ratio: 3.3, time: 25, release: '15 Min NPR',
                    soakMinutes: 480, defaultSoakMinutes: 480,
                    soak: { ratio: 2.4, time: 11 },
                    note: '💧 Soaked overnight (8 hrs, recommended): time drops from 25 to 11 min',
                },
                'ful-medames': {
                    label: 'Ful Medames (Fava)', icon: '🫘',
                    ratio: 3.8, time: 45, release: '15 Min NPR',
                    soakMinutes: 600, defaultSoakMinutes: 600,
                    soak: { ratio: 2.8, time: 20 },
                    note: '💧 Soaking 8–12 hrs (recommended 10) is essential for split dried fava — roughly halves cook time',
                },
            },
        },
        combo: {
            label: 'Combo Dishes', icon: '🍛',
            items: {
                'mujaddara': {
                    label: 'Mujaddara (Lentils+Rice)', icon: '🍛',
                    ratio: 2.5, time: 10, release: '10 Min NPR',
                    soakMinutes: 60, defaultSoakMinutes: 0,
                    soak: { ratio: 2.3, time: 8 },
                    note: 'Weight = combined lentils + rice, split 1:1 by weight. Traditional recipe skips soaking; pre-soaking the lentils ~1 hr trims a couple minutes if you want to.',
                },
            },
        },
    };

    const MODIFIER_ON = 'bg-blue-600 text-white border-blue-600';
    const MODIFIER_OFF = 'bg-gray-50 text-gray-500 border-gray-200';

    let weight = 300;
    let currentCategory = 'rice';
    let currentItemId = 'white-basmati';

    const currentItem = () => categories[currentCategory].items[currentItemId];

    let soakHours = currentItem().defaultSoakMinutes / 60;

    const soakFraction = (item, hours) => {
        if (!item.soak || item.soakMinutes <= 0) return 0;
        const capHours = item.soakMinutes / 60;
        return Math.min(hours, capHours) / capHours;
    };

    const activeRatio = (item, hours) => {
        if (!item.soak) return item.ratio;
        const f = soakFraction(item, hours);
        return item.ratio + (item.soak.ratio - item.ratio) * f;
    };

    const activeTime = (item, hours) => {
        if (!item.soak) return item.time;
        const f = soakFraction(item, hours);
        return Math.round(item.time + (item.soak.time - item.time) * f);
    };

    const calculateWater = (w, item, hours) => {
        if (!w || w <= 0) return 0;
        return Math.round((w * activeRatio(item, hours)) / 10) * 10;
    };

    const weightLabelFor = (categoryId) => {
        if (categoryId === 'combo') return 'Combined Dry Weight — Lentils + Rice, 1:1 (grams)';
        return `Dry ${categories[categoryId].label} Weight (grams)`;
    };

    const categoryGrid = document.getElementById('category-grid');
    const itemGrid = document.getElementById('item-grid');
    const weightInput = document.getElementById('weight');
    const weightLabel = document.getElementById('weight-label');
    const soakWrap = document.getElementById('soak-wrap');
    const soakInput = document.getElementById('soak-hours');
    const noteEl = document.getElementById('note');
    const warningEl = document.getElementById('warning');

    Object.entries(categories).forEach(([id, cat]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.id = id;
        btn.innerHTML = `<span class="text-xl">${cat.icon}</span><span class="text-[11px] leading-tight text-center">${cat.label}</span>`;
        btn.className = 'py-2 px-1 rounded-lg font-bold flex flex-col items-center gap-1 transition-all border-2';
        btn.addEventListener('click', () => {
            currentCategory = id;
            currentItemId = Object.keys(categories[id].items)[0];
            soakHours = currentItem().defaultSoakMinutes / 60;
            render();
        });
        categoryGrid.appendChild(btn);
    });

    soakInput.addEventListener('input', (e) => {
        soakHours = parseFloat(e.target.value) || 0;
        render();
    });

    weightInput.addEventListener('input', (e) => {
        weight = parseInt(e.target.value, 10) || 0;
        render();
    });

    let itemGridCategory = null;

    function renderItemGrid() {
        itemGrid.innerHTML = '';
        Object.entries(categories[currentCategory].items).forEach(([id, item]) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.dataset.id = id;
            btn.innerHTML = `<span class="text-2xl">${item.icon}</span>${item.label}`;
            btn.addEventListener('click', () => {
                currentItemId = id;
                soakHours = item.defaultSoakMinutes / 60;
                render();
            });
            itemGrid.appendChild(btn);
        });
        itemGridCategory = currentCategory;
    }

    function render() {
        const catBase = 'py-2 px-1 rounded-lg font-bold flex flex-col items-center gap-1 transition-all border-2';
        categoryGrid.querySelectorAll('button').forEach((btn) => {
            btn.className = btn.dataset.id === currentCategory
                ? `${catBase} bg-blue-100 text-blue-800 border-blue-600 shadow-sm`
                : `${catBase} bg-gray-50 text-gray-500 border-transparent hover:bg-gray-100`;
        });

        if (itemGridCategory !== currentCategory) {
            renderItemGrid();
        }
        const itemBase = 'py-3 px-2 rounded-xl font-bold text-sm flex flex-col items-center gap-1 transition-all border-2';
        itemGrid.querySelectorAll('button').forEach((btn) => {
            btn.className = btn.dataset.id === currentItemId
                ? `${itemBase} bg-blue-100 text-blue-800 border-blue-600 shadow-sm`
                : `${itemBase} bg-gray-50 text-gray-500 border-transparent hover:bg-gray-100`;
        });

        weightLabel.textContent = weightLabelFor(currentCategory);

        const item = currentItem();

        if (item.soak) {
            soakWrap.classList.remove('hidden');
            soakInput.value = soakHours;
        } else {
            soakWrap.classList.add('hidden');
        }

        noteEl.textContent = item.note || '';

        if (item.warning) {
            warningEl.textContent = item.warning;
            warningEl.classList.remove('hidden');
        } else {
            warningEl.classList.add('hidden');
        }

        document.getElementById('water').textContent = calculateWater(weight, item, soakHours);
        document.getElementById('time').textContent = activeTime(item, soakHours);
        document.getElementById('release').textContent = item.release;
        document.getElementById('ratio').textContent = `Ratio 1 : ${activeRatio(item, soakHours).toFixed(2)} (dry : water)`;
    }

    render();
</script>
</body>
</html>
